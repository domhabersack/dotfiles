name: shellcheck

on:
  # Only the default branch on push; PR branches are covered by the
  # pull_request trigger below, so a push to a branch with an open PR doesn't
  # run this workflow twice.
  push:
    branches:
      - main
    paths:
      - "bin/**"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "bin/**"
      - ".github/workflows/shellcheck.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # -x follows the "shellcheck source=" directives used to lint the
      # sourced bin/tmux-locklib alongside its callers; those paths resolve
      # relative to the working directory, hence running from inside bin/.
      - name: Run shellcheck
        working-directory: bin
        run: shellcheck -x *
