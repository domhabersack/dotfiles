name: shellcheck

on:
  push:
    paths:
      - "bin/**"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "bin/**"
      - ".github/workflows/shellcheck.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # -x follows the "shellcheck source=" directives used to lint the
      # sourced bin/tmux-locklib alongside its callers; those paths resolve
      # relative to the working directory, hence running from inside bin/.
      - name: Run shellcheck
        working-directory: bin
        run: shellcheck -x *
