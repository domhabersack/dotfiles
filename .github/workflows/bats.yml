name: bats

on:
  push:
    paths:
      - "bin/**"
      - ".github/workflows/bats.yml"
  pull_request:
    paths:
      - "bin/**"
      - ".github/workflows/bats.yml"

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats tests
        working-directory: bin
        run: bats *.bats
