name: bats

on:
  # Only the default branch on push; PR branches are covered by the
  # pull_request trigger below, so a push to a branch with an open PR doesn't
  # run this workflow twice.
  push:
    branches:
      - main
    paths:
      - "bin/**"
      - ".github/workflows/bats.yml"
  pull_request:
    paths:
      - "bin/**"
      - ".github/workflows/bats.yml"

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats tests
        working-directory: bin
        run: bats *.bats
