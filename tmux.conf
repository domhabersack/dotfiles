################################
# Key bindings                 #
################################

# unbind Ctrl-B (default prefix)
unbind C-b

# remap prefix to Control-A
set -g prefix C-a

# send C-a through to other applications that also use it by pressing it twice
bind C-a send-prefix

# split panes (inherit current pane's directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# lazygit in a floating popup (inherits current pane's directory)
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -b heavy -E "lazygit"

# ccusage monthly usage/cost totals (up to the last six months, no
# per-model split -- that lives in prefix+y below) in a floating popup;
# no -E so the popup waits for a keypress instead of flashing closed the
# instant the report prints.
bind u display-popup -w 60% -h 80% -b heavy "~/.dotfiles/bin/tmux-ccusage-popup"

# companion to prefix+u: aggregated per-model usage distribution (cost% and
# token%) for this month (to date) and last month, in a floating popup.
bind y display-popup -w 70% -h 80% -b heavy "~/.dotfiles/bin/tmux-ccusage-models-popup"

# reload ~./tmux.conf
bind r source-file ~/.tmux.conf \; display 'Reloaded tmux-configuration.'

# cheat sheet of every custom shortcut this config defines (bin/tmux-
# shortcuts-popup/-feed), any that are currently gated off (e.g. prefix+e
# without espanso installed) marked "(unavailable)". `S`, not the more
# obvious `?` or `/` -- both are tmux-internal defaults (list-keys and the
# interactive key-lookup prompt) that this shouldn't shadow.
bind S display-popup -w 70% -h 70% -b heavy -E "~/.dotfiles/bin/tmux-shortcuts-popup"

# navigate to panes using vim-like navigation keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# cycle through windows using C-h and C-l, again as seen in tmux
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# jump straight to the next window with a pending notification — the 🔔 windows
# listed in status-right (see bin/tmux-notify-windows). Repeatable, so pressing
# n again cycles to the next one; visiting a window clears its bell.
bind -r n run-shell '~/.dotfiles/bin/tmux-next-bell'

# jump back to the last active window, pairing with prefix+n above so you can
# bounce between a notification window and wherever you came from.
bind -r b last-window

# resize current pane in direction specified by vim-like keys (repeatable)
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# copy and paste using vim key bindings
unbind p
bind Escape copy-mode
bind p paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'


################################
# Mouse mode                   #
################################

# enable mouse mode so fullscreen apps (Claude Code, vim, less) receive scroll
# events; without it tmux swallows their mouse-tracking request and the terminal
# falls back to alternate-scroll mode, turning the wheel into arrow keys
set -g mouse on


################################
# Behavior                     #
################################

# change the default delay so keystrokes are more responsive
set -s escape-time 1

# forward focus events so vim autoread and gitgutter update on pane switch
set -g focus-events on

# prevent scrollback
#set -g history-limit 0

# default history
set -g history-limit 2000

# let escape sequences (e.g. terminal image/clipboard protocols) pass through
# from panes to the outer terminal, and forward extended key info (modifiers
# like Ctrl/Shift on more keys) so apps like neovim can read them
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'


################################
# Look and feel                #
################################

# enable 256 colors. tmux-256color (tmux's own terminfo entry) rather than
# screen-256color (a legacy compat entry): the latter doesn't reliably pass
# "default" colors through to the outer terminal's real background --
# status-bg default was rendering as an unrelated color (green) in
# Terminal.app before this switch. Trade-off: a remote host reached via
# ssh/mosh needs its own tmux-256color terminfo entry (ncurses 6+) if you
# run tmux there too, or nested colors may misrender.
set -g default-terminal 'tmux-256color'

# show status bar by default, up to four rows, top to bottom:
#   [top] a full-width horizontal rule drawn adjacent to the pane content,
#       faking a border above the status area, with the active window's
#       identity set into it like a legend: its name, then in a git repo its
#       dim branch (see "Window worktree status"), replaced by a colored badge
#       with the worktree's name (the same as the branch's, see
#       git-worktree-add) if this window sits in a linked git worktree. The
#       unread-mail indicator (@mail, see "Local mail"), when there is any,
#       goes between the name and the branch, so on a client just too narrow
#       for everything it is the branch that gets cut off, not the mail.
#       window_name/@worktree_name/@git_branch all resolve against the
#       client's current window. This row shows for every window, git or not.
#   [middle] up to two content rows, each only when it has something: the
#       active repo's open-PR / vulnerability health (@repo_pr via
#       status-left, see "Repo PR status"), then the active window's branch PR
#       status (@branch_pr, see "Branch PR status" — number, diff size,
#       checks, review, unresolved conversations).
#   [bottom] the windows in this session with a pending bell (status-right,
#       see "Window notifications"), blank when none. Always present.
#
# The bar grows upward from the bottom edge of the terminal, so the rows that
# come and go are kept in the middle: the bell list -- the click targets used
# most -- never moves, and the branch PR row, when there is one, is always the
# row above it. The rows above those shift. The status-format[1]/[2]/[3]
# conditionals do that slot juggling: format [n] is whichever row is n-th
# given which of @repo_pr / @branch_pr are set, and the last one shown is
# always the bell list. Which row is last comes from the bar's actual height
# (#{status}), not from the options: bin/tmux-status-rows sets the height a
# moment after the options change (and per session, while the options follow
# each client's window), so the two can disagree, and the bells must still be
# on the bottom row, once. A disagreement only leaves a middle row blank or
# hides one. Each row is kept as its own option (@footer_row_*)
# so the juggling reads as row names; #{E:...} re-expands them so the nested
# #[...] styles (and ## → # escapes) resolve.
# status-format[] fully overrides the default single-line assembly.
#
# Narrow clients (Termius on a phone): below @footer_narrow columns, every row
# switches to a short form -- the window name and badge cut to 14 characters
# and the branch to its last 16, each plus a … when cut, @mail_short / @bells_short / @branch_pr_short
# / @repo_pr_short in place of the full options (set by the same scripts, see
# each), falling back to the full one if a short form isn't set yet. The test
# lives in @footer_is_narrow so every row agrees on it. Each format is drawn
# per client, so a phone and a wide Mac attached at the same time each get
# their own.
#
# A middle row only exists when it has something to show: bin/tmux-status-rows
# sizes the bar to 2 (neither), 3 (one), or 4 (both) so there's no blank row.
# The `4` here is just the startup default until that script first runs (on
# the initial renders below).
set -g @footer_narrow 60
set -g @footer_is_narrow '#{e|<:#{client_width},#{@footer_narrow}}'
set -g @footer_row_legend '#[fg=#{@footer_dim}]─ #[fg=#{@footer_text}]#{?#{E:@footer_is_narrow},#{=/14/…:window_name},#{window_name}}#[default]#{?#{@worktree_name},#[fg=#{@badge_bg}]◀#[bg=#{@badge_bg}]#[fg=#{@badge_fg}] #{?#{E:@footer_is_narrow},#{=/14/…:@worktree_name},#{@worktree_name}} #[default],}#{?#{@mail}, #[fg=#{@footer_dim}]─ #[default]#{?#{&&:#{E:@footer_is_narrow},#{@mail_short}},#{E:@mail_short},#{E:@mail}},}#{?#{@worktree_name},,#{?#{@git_branch}, #[fg=#{@footer_dim}]#{?#{@mail},─ ,}#{?#{E:@footer_is_narrow},#{=/-16/…:@git_branch},#{@git_branch}}#[default],}} #[fg=#{@footer_dim}]#{R:─,#{window_width}}#[default]'
set -g @footer_row_repo '#{?#{&&:#{E:@footer_is_narrow},#{@repo_pr_short}},#{E:@repo_pr_short},#{E:status-left}}'
set -g @footer_row_pr '#{?#{&&:#{E:@footer_is_narrow},#{@branch_pr_short}},#{E:@branch_pr_short},#{E:@branch_pr}}'
set -g @footer_row_bells '#{?#{&&:#{E:@footer_is_narrow},#{@bells_short}},#{E:@bells_short},#{E:status-right}}'
set -g status 4
set -g status-format[0] '#{E:@footer_row_legend}'
set -g status-format[1] '#{?#{==:#{status},2},#{E:@footer_row_bells},#{?#{@repo_pr},#{E:@footer_row_repo},#{?#{@branch_pr},#{E:@footer_row_pr},}}}'
set -g status-format[2] '#{?#{==:#{status},3},#{E:@footer_row_bells},#{?#{&&:#{@repo_pr},#{@branch_pr}},#{E:@footer_row_pr},}}'
set -g status-format[3] '#{E:@footer_row_bells}'

# footer colors, as variables so a theme can retune them from
# ~/.tmux.conf.local (sourced last; formats expand these at render time, so no
# reload order issues). Any tmux colour value works ("colour244", "#808080",
# "brightblack", "default"):
#   @footer_text  primary footer text (window name). "default" = the terminal's
#                 own foreground, so it flips with light/dark themes for free
#   @footer_dim   de-emphasized text and the horizontal rule. A mid-gray
#                 (#808080) stays legible on both light and dark backgrounds
set -g @footer_text 'default'
set -g @footer_dim  'colour244'
# worktree badge, a lighter neutral gray (#e4e4e4) than @footer_dim with
# near-black text for contrast, in the top row's legend (see
# @footer_row_legend): shown only
# in a linked worktree, as a filled block with a space of padding on each side
# of the worktree name and a ◀ (U+25C0, no special font needed) as its left edge; it takes the place of the plain branch label
set -g @badge_bg    'colour254'
set -g @badge_fg    'colour232'

# the footer takes the terminal's own background so it follows whatever color
# theme is active (light, dark, or switching automatically). Set it through
# status-style, NOT the deprecated status-bg/status-fg aliases: `set status-bg
# default` is merged onto status-style's built-in bg=green and tmux emits
# ESC[42m (green) -- that, not tmux-256color, was the "unrelated color" seen
# in Terminal.app, and why the bar was pinned to white (colour231) before.
# Verified by attaching to a throwaway server and reading the emitted SGR:
# status-bg default -> ESC[42m, status-style bg=default -> no bg escape.
set -g status-style "bg=default,fg=#{@footer_dim}"
# status-bg/status-fg are separate legacy options layered over status-style, and
# a reload doesn't unset what an earlier config set: a session started on the
# old config keeps status-bg colour231 and the footer stays white. Unset them
# so a plain reload (prefix r) is enough.
set -gu status-bg
set -gu status-fg

# frequency of status bar redraws in seconds (default: 15 seconds)
set -g status-interval 60

# align window list to the left
set -g status-justify left

# The repo PR / vulnerability health row: open-PR / vulnerability count for
# whichever repo the active pane is in (see "Repo PR status" section below).
# Referenced via #{E:status-left} from @footer_row_repo above — it renders
# above the branch PR row when both are present, or takes the single middle
# row when it's the only one. The active window's name + branch sit in the top
# row's legend (@footer_row_legend); the full window list used to live here
# but stopped being useful past a handful of windows — use choose-tree (prefix w)
# to browse/jump instead, where the Claude quota also still lives (session row).
set -g status-left '#{@repo_pr}'
# Generously high rather than sized to a worst case: nothing else competes
# for this space now (window list is blank, status-right has its own row), so the
# terminal's actual width is the only real constraint that should apply.
set -g status-left-length 500

# The notification indicator — the windows in this session with a pending bell,
# as "🔔 name · name" (see bin/tmux-notify-windows and the "Window notifications"
# section below), so you can tell from any window that another one wants
# attention without opening choose-tree. Set per-session by that script; this
# global default is the empty state (no pending bells). Because status-format[]
# overrides the default status-line assembly, this option is NOT auto-drawn on
# the right — @footer_row_bells pulls it in as the bottom row (or the same
# script's @bells_short, on a narrow client), which is where it actually
# appears.
set -g status-right ''

# set indices to start at one instead of zero
set -g base-index 1
setw -g pane-base-index 1

# highlight active window
setw -g window-status-current-style bg=red,fg=white

# highlight current selection in choose-tree and copy mode
set -g mode-style "bg=colour15"

# highlight active pane with bold border
set -g pane-active-border-style bg=white,fg=white

# widths in layouts
setw -g main-pane-width 108

# choose-tree, no (0)/(M-a) shortcut-key column: session rows show the
# Claude Code usage statusline (bin/tmux-usage-statusline; blank if its
# cache file doesn't exist, see README) in place of tmux's intrinsic
# session-name label; window rows show the decorated window name, plus a
# bold flag + "done/total" count while TMUX_OBSIDIAN_DAILY_DIR is set and
# tasks tagged #<window-slug> are open (see "Obsidian daily-notes tasks"
# below) — both pieces are absent/empty when unset, so this format then
# renders exactly as it would with neither feature configured.
#
# The branch label is suppressed here when it’s plain "main": the trunk is
# the default, so printing it on every non-feature window is noise — hiding
# it makes the windows actually parked on a feature branch stand out. The
# status bar (@footer_row_legend) still shows the active window’s branch
# regardless, so "which branch is main on" is a glance away when you need
# it. Non-main branches render as before -- this suppression is keyed on the
# bare branch name, before any ⎇ prefix is applied, since a window whose
# branch is "main" can never itself be a linked worktree (git refuses to
# check the same branch out in two worktrees at once).
#
# A window whose pane isn't in a git repo at all (empty @git_branch) has its
# name rendered in italics, so non-repo scratch/utility windows read as
# visually distinct from the code repos. @git_branch is the signal: a real
# repo always resolves to a branch name (even a detached HEAD or an unborn
# main), so empty means "not a work tree". Italics needs a terminal whose
# font has an italic face (tmux-256color's terminfo advertises sitm/ritm);
# where it can't render, the name simply shows upright — no breakage.
#
# A pinned window (prefix+P, see "Window pinning" below) gets a 📌 between the
# freshness bar and the name — its own segment, not baked into window_name, so
# it never touches sorting (tmux-sort-windows sorts by window_name via
# tmux-window-slug's leading-marker strip, and this marker never reaches
# either).
#
# A window sitting in a linked git worktree gets the same colored worktree-name
# badge as the status bar (@badge_bg/@badge_fg), in place of its branch label
# (the two are the same name, see "Window worktree status" below). It is never
# baked into window_name itself, for the same reason as 📌.
bind w choose-tree -w -Z -N -K '' -F '#{?session_format,#(~/.dotfiles/bin/tmux-usage-statusline),#{?#{@freshness},#{@freshness} ,}#{?#{==:#{@pinned},1},📌 ,}#{?#{@tmux_color},#[#{@tmux_color}],}#{?#{@git_branch},,#[italics]}#{?#{@tmux_open_tasks},#[bold],}#{window_name}#{?#{@tmux_open_tasks},#[nobold],}#{?#{@git_branch},,#[noitalics]}#{?#{@worktree_name},#[fg=#{@badge_bg}]◀#[bg=#{@badge_bg}]#[fg=#{@badge_fg}] #{@worktree_name} #[default],#{?#{==:#{@git_branch},main},,#{?#{@git_branch}, #[fg=colour244]#{@git_branch}#[default],}}}#{?window_bell_flag, 🔔,}#{?#{@tmux_tasks}, #[fg=black]#{@tmux_tasks},}#[default]}'
# hidden from the status bar (see status-left above); still available via
# choose-tree (prefix w), which uses its own -F format above.
setw -g window-status-current-format ''
setw -g window-status-format         ''
setw -g window-status-separator ''

# hide the status bar entirely while a pane is in tree mode (choose-tree,
# which -Z above already zooms full-screen) -- pane-mode-changed fires on
# entering AND leaving any mode, so the else branch (pane_mode back to its
# baseline, or a different mode like copy-mode) restores the status bar. It
# hands off to bin/tmux-status-rows rather than hardcoding a height, so leaving
# a mode lands on 2 or 3 rows depending on whether the active window has a
# health line to show (see that script). Verified live: baseline pane_mode is
# "view-mode", not empty, in this tmux version -- the else branch doesn't need
# to match it explicitly since it's just "anything that isn't tree-mode".
set-hook -g pane-mode-changed 'if -F "#{==:#{pane_mode},tree-mode}" "set -g status off" "run-shell -b ~/.dotfiles/bin/tmux-status-rows"'

# notify on changes in windows
setw -g monitor-activity on
set -g visual-activity off

# style window that has activity on it
setw -g window-status-activity-style bg=white,fg=red,none

# bell: show 🔔 in window list when a pane rings. This is the fallback shown
# for any bell not claimed by a more specific emoji below (e.g. Claude Code
# notification types with no dedicated hook, or bells from other programs
# entirely) — see the "Claude Code notifications" section for the overrides.
set -g bell-action any
set -g visual-bell off


################################
# Hook reload safety           #
################################

# Every `prefix r` re-runs every set-hook below, and tmux never deduplicates
# -ga (append) entries — so without this, each reload piles another full
# copy onto these hooks forever (confirmed live: after-select-window had
# accumulated 20+ duplicate tmux-freshness-windows entries). Clear each name
# first so a reload replaces its list instead of extending it.
set-hook -gu after-new-window
set-hook -gu after-rename-window
set-hook -gu window-unlinked
set-hook -gu after-select-window
set-hook -gu after-select-pane
set-hook -gu session-window-changed
set-hook -gu alert-bell


################################
# Window sorting               #
################################

set-hook -g after-new-window    'run-shell -b ~/.dotfiles/bin/tmux-sort-windows'
set-hook -g after-rename-window 'run-shell -b ~/.dotfiles/bin/tmux-sort-windows'
set-hook -g window-unlinked     'run-shell -b ~/.dotfiles/bin/tmux-sort-windows'


################################
# Window coloring              #
################################

set-hook -ga after-new-window    'run-shell -b ~/.dotfiles/bin/tmux-color-windows'
set-hook -ga after-rename-window 'run-shell -b ~/.dotfiles/bin/tmux-color-windows'
set-hook -ga window-unlinked     'run-shell -b ~/.dotfiles/bin/tmux-color-windows'

run-shell -b '~/.dotfiles/bin/tmux-color-watch'
run-shell -b '~/.dotfiles/bin/tmux-color-windows'


################################
# Window freshness             #
################################

# Track how recently each window was accessed and render a 4-cell shaded bar
# (░░░░ .. ████) at the start of each window-list entry. Re-render on every
# window switch/create so the active window jumps to full freshness instantly.
set-hook -ga after-new-window       'run-shell -b ~/.dotfiles/bin/tmux-freshness-windows'
set-hook -ga after-select-window    'run-shell -b ~/.dotfiles/bin/tmux-freshness-windows'
set-hook -ga session-window-changed 'run-shell -b ~/.dotfiles/bin/tmux-freshness-windows'

# Background ticker decays the bars over time; render once now on startup.
run-shell -b '~/.dotfiles/bin/tmux-freshness-watch'
run-shell -b '~/.dotfiles/bin/tmux-freshness-windows'


################################
# Window git branch            #
################################

# Stamp each window with @git_branch — a dim branch label for the repo its
# active pane is in — appended after the window name in choose-tree (bind w
# above), so a repo window reads "codeshots main" and a non-repo window stays
# "dotfiles". The status line shows the same label for the active window, added
# inline by bin/tmux-repo-pr next to the repo name it already prints. Refresh
# on every window create/rename/select and session change so it tracks as you
# navigate; a `git checkout` in a window you sit still in is caught by the
# ticker below (after-rename-window also fires when zsh auto-names a window on
# first entering a repo — see ~/.zshrc — so the branch appears right away).
set-hook -ga after-new-window       'run-shell -b ~/.dotfiles/bin/tmux-git-branch-windows'
set-hook -ga after-rename-window    'run-shell -b ~/.dotfiles/bin/tmux-git-branch-windows'
set-hook -ga after-select-window    'run-shell -b ~/.dotfiles/bin/tmux-git-branch-windows'
set-hook -ga session-window-changed 'run-shell -b ~/.dotfiles/bin/tmux-git-branch-windows'

# Background ticker catches branch switches with no window event; render once now.
run-shell -b '~/.dotfiles/bin/tmux-git-branch-watch'
run-shell -b '~/.dotfiles/bin/tmux-git-branch-windows'



################################
# Obsidian daily-notes tasks   #
################################

# TMUX_OBSIDIAN_DAILY_DIR (set in ~/.zshrc.local) points at a directory of
# Obsidian daily notes; unset, every line below is an inert no-op — the
# scripts exit before touching any window option, and the if-shell below
# never registers a binding. Set, choose-tree's window rows (bind w above)
# show a bold name + "done/total" while tasks tagged #<window-slug> are
# open, and prefix+T opens an interactive popup (bin/tmux-obsidian-task-
# picker) listing every task across all daily notes, grouped by project
# tag, where space/enter toggles a task's checkbox in place -- see
# README.md for the full key list and docs/superpowers/specs for the
# design. Falls back to the previous read-only list (bin/tmux-obsidian-
# task-list) if fzf isn't available.
set-hook -ga after-new-window    'run-shell -b ~/.dotfiles/bin/tmux-obsidian-tasks'
set-hook -ga after-rename-window 'run-shell -b ~/.dotfiles/bin/tmux-obsidian-tasks'

run-shell -b '~/.dotfiles/bin/tmux-obsidian-watch'
run-shell -b '~/.dotfiles/bin/tmux-obsidian-tasks'

if-shell -b '[ -n "$TMUX_OBSIDIAN_DAILY_DIR" ]' \
  'bind T display-popup -E -w 90% -h 90% "~/.dotfiles/bin/tmux-obsidian-task-picker"'


################################
# Branch PR status             #
################################

# @branch_pr (@footer_row_pr above) shows the state of the OPEN pull request
# whose head is the active window's current branch — number, diff size, checks,
# review decision / draft, unresolved conversations — read-only via `gh api
# graphql` (see README for setup). Its own row, appearing only while such a PR
# exists, just above the bell list and below the repo-wide health row. Re-render on every event
# that can change which branch/PR is "active": window switch, pane switch,
# freshly-opened window, and session change.
set-hook -ga after-select-window    'run-shell -b ~/.dotfiles/bin/tmux-branch-pr'
set-hook -ga after-select-pane      'run-shell -b ~/.dotfiles/bin/tmux-branch-pr'
set-hook -ga session-window-changed 'run-shell -b ~/.dotfiles/bin/tmux-branch-pr'
set-hook -ga after-new-window       'run-shell -b ~/.dotfiles/bin/tmux-branch-pr'

# Background ticker catches a `git checkout` (or a CI run finishing, a review
# landing) with no window/pane event, and refreshes stale per-branch caches
# while idle; render once now.
run-shell -b '~/.dotfiles/bin/tmux-branch-pr-watch'
run-shell -b '~/.dotfiles/bin/tmux-branch-pr'


################################
# Repo PR status               #
################################

# status-left (see above) shows the open PR count for whichever repo the
# active pane is in (read-only `gh pr list`, see README for setup). Re-render
# on every event that can change which repo is "active": window switch, pane
# switch within a window, and a freshly-opened window.
set-hook -ga after-select-window    'run-shell -b ~/.dotfiles/bin/tmux-repo-pr'
set-hook -ga after-select-pane      'run-shell -b ~/.dotfiles/bin/tmux-repo-pr'
set-hook -ga session-window-changed 'run-shell -b ~/.dotfiles/bin/tmux-repo-pr'
set-hook -ga after-new-window       'run-shell -b ~/.dotfiles/bin/tmux-repo-pr'


################################
# PR link click-through        #
################################

# Both PR rows above mark their clickable segment with #[range=user|<tag>]
# ("branch_pr" in tmux-branch-pr, "repo_pr" in tmux-repo-pr); any range=user
# text fires the "Status" mouse key with #{mouse_status_range} set to that
# tag, wherever on the status bar it renders. -T root (not the prefix table)
# so it fires on a plain click, matching every other mouse binding tmux sets
# up by default when `mouse on` is set. bin/tmux-open-pr-link resolves the
# active pane's repo (and, for branch_pr, its cached PR number) and opens the
# right GitHub page; a click outside both ranges is a silent no-op.
# Window ids ("@12") are the range tags bin/tmux-notify-windows uses for the
# 🔔 entries in status-right and @bells_short; clicking one selects that
# window. The 📧 entry (see "Local mail" below) is tagged "mail" and opens the
# mail popup, full width on a narrow client. Anything else falls through to
# the PR link handler. Ranges work on every status row, so it doesn't matter
# which row an entry has moved to.
bind-key -T root MouseDown1Status {
  if-shell -F '#{==:#{mouse_status_range},mail}' {
    if-shell -F '#{E:@footer_is_narrow}' {
      display-popup -w 100% -h 70% -b heavy -E "~/.dotfiles/bin/tmux-mail-popup"
    } {
      display-popup -w 80% -h 70% -b heavy -E "~/.dotfiles/bin/tmux-mail-popup"
    }
  } {
    if-shell -F '#{m:@*,#{mouse_status_range}}' {
      run-shell "tmux select-window -t '#{mouse_status_range}'"
    } {
      run-shell -b "~/.dotfiles/bin/tmux-open-pr-link \"#{mouse_status_range}\""
    }
  }
}

# Background ticker catches a `cd` into a different repo with no window/pane
# event, and refreshes stale per-repo caches while idle; render once now.
run-shell -b '~/.dotfiles/bin/tmux-repo-pr-watch'
run-shell -b '~/.dotfiles/bin/tmux-repo-pr'


################################
# Window notifications         #
################################

# status-right (see above) lists this session's windows with a pending bell —
# "🔔 name · name", empty when none — via bin/tmux-notify-windows, so another
# window wanting attention is visible without opening choose-tree. The bell is
# the same window_bell_flag that drives the 🔔 in the choose-tree list (e.g.
# Claude Code waiting for input). Re-render on a new bell (alert-bell) and on
# the events where a bell clears — visiting its window, or the window closing.
set-hook -ga alert-bell             'run-shell -b ~/.dotfiles/bin/tmux-notify-windows'
set-hook -ga after-select-window    'run-shell -b ~/.dotfiles/bin/tmux-notify-windows'
set-hook -ga session-window-changed 'run-shell -b ~/.dotfiles/bin/tmux-notify-windows'
set-hook -ga window-unlinked        'run-shell -b ~/.dotfiles/bin/tmux-notify-windows'

run-shell -b '~/.dotfiles/bin/tmux-notify-windows'


################################
# Local mail                   #
################################

# @mail (in the top row's legend, after the branch) shows who has
# unread mail in the local mailbox, "📧 agent (2) · daemon (1)", via
# bin/tmux-mail-status; empty, and so absent, when nothing is unread. Mail
# arrives from other profiles on this machine (an agent profile telling you it
# is stuck, say), and nothing in tmux fires when it lands, so a background
# ticker checks the mailbox once a minute; render once now, with --force so a
# reload or a new server never trusts a stamp left from before.
#
# prefix+m, or a click on the 📧 entry (MouseDown1Status above), opens a popup
# listing the messages (bin/tmux-mail-popup): space/enter toggle a message
# read/unread, ctrl-d deletes it. Sending is not this repo’s concern; anything
# that delivers to the local mailbox shows up here.
#
# On a client narrower than @footer_narrow the popup takes the full width (the
# same switch as the mouse binding above): display-popup doesn't expand
# formats in -w, so it's picked with if-shell -F instead.
bind m if-shell -F '#{E:@footer_is_narrow}' {
  display-popup -w 100% -h 70% -b heavy -E "~/.dotfiles/bin/tmux-mail-popup"
} {
  display-popup -w 80% -h 70% -b heavy -E "~/.dotfiles/bin/tmux-mail-popup"
}
run-shell -b '~/.dotfiles/bin/tmux-mail-watch'
run-shell -b '~/.dotfiles/bin/tmux-mail-status --force'


################################
# Window pinning               #
################################

# prefix+P: toggle @pinned on the active window — a "come back to this later"
# mark, independent of the window name, shown as a 📌 in choose-tree (bind w
# above). A plain window user option, so it survives renames and the
# move-window churn bin/tmux-sort-windows puts every window through.
#
# The off state is an explicit 0 rather than `set -u`, and every reader tests
# `== 1` rather than truthiness. Unsetting would only remove the WINDOW-level
# value, so if @pinned ever gained a session- or global-level value the option
# would still resolve truthy through inheritance: the unpin branch would report
# "Window unpinned", the 📌 would stay, and the window could never be unpinned
# again. An explicit 0 shadows any inherited value and cannot drift.
bind P if-shell -F '#{==:#{@pinned},1}' \
  'set-window-option @pinned 0 ; display "Window unpinned"' \
  'set-window-option @pinned 1 ; display "Window pinned 📌"'

# @pinned is the one window option here with no watcher to re-derive it — it
# exists only because you pressed prefix+P — so it is written to disk on save
# and re-applied after restore. See bin/tmux-pinned-save for why, and for the
# session+name key's one blind spot (duplicate window names within a session).
set -g @resurrect-hook-post-save-all    '~/.dotfiles/bin/tmux-pinned-save'
set -g @resurrect-hook-post-restore-all '~/.dotfiles/bin/tmux-pinned-restore'


################################
# Git worktrees                #
################################

# prefix+W: popup listing every worktree of the CURRENT repo (bin/tmux-
# worktree-feed, via `git worktree list --porcelain`, scoped to the repo of
# the popup’s own cwd -- -d below -- since git worktree list itself lists
# every worktree of a repo from any one of them). The worktree containing
# that cwd is marked -- git worktree list has no such marker of its own, so
# this is computed by comparing paths. A `bare` main worktree or `prunable`
# linked one (directory deleted, not yet removed) is left off the list
# entirely, since picking either would silently do nothing -- see the feed
# script. Enter hands off (exec) to bin/tmux-worktree-switch, which searches
# every window in every session for one already sitting in that worktree
# (even if it has since `cd`’d somewhere inside it), or creates a new one in
# the CURRENT session, named plainly after the repo either way -- which kind
# of worktree a window sits in is shown separately and LIVE, as a prefix on
# its branch label, see "Window worktree status" below, not baked into the
# name at creation time.
#
# Same fzf-resolve-with-less-fallback shape as prefix+S/prefix+e (see bin/
# tmux-worktree-popup); the less fallback is read-only, same limitation as
# those.
#
# Creating a NEW worktree (as opposed to switching to an existing one) is a
# shell-side entry point instead of a popup action, since a script can’t cd
# its caller’s shell: `git-worktree-new <name>` in ~/.zshrc’s FUNCTIONS
# section calls bin/git-worktree-add, then either hands off to this same
# bin/tmux-worktree-switch (inside tmux) or cd’s directly (outside tmux).
bind W display-popup -d "#{pane_current_path}" -w 60% -h 50% -b heavy -E "~/.dotfiles/bin/tmux-worktree-popup"


################################
# Window worktree status       #
################################

# Stamps every window with @worktree_here (a ⎇ when its pane sits in a
# LINKED git worktree, empty otherwise) and @worktree_name (that worktree’s
# directory name, which the badge in the status bar and the choose-tree
# format (bind w above) shows) -- see bin/tmux-worktree-status. @worktree_here
# renders as a PREFIX directly on @git_branch itself (bin/tmux-git-branch no
# longer wraps the branch name in parentheses, so a ⎇ can sit right in front
# of it instead), with a trailing space of its own (it is literally "⎇ ",
# not "⎇") so the glyph never runs into the character right after it.
# This is what makes a worktree window’s connection to its
# repo obvious without baking anything into window_name itself (see
# bin/tmux-window-slug): naming every worktree window plainly after the
# repo, same as bin/tmux-worktree-switch does, keeps them sorted and colored
# alongside it for free.
#
# Mirrors "Window git branch" above exactly, including why it exists as its
# own pass covering ALL windows (not just the active one) and why a live
# per-window computation -- rather than something set once when a window is
# created -- matters here specifically: a window that ends up in a worktree
# by hand (a plain `cd`, not through bin/tmux-worktree-switch) still gets
# marked correctly, since this recomputes from each window’s live pane path
# rather than trusting whoever created the window to have gotten it right.
set-hook -ga after-new-window       'run-shell -b ~/.dotfiles/bin/tmux-worktree-status-windows'
set-hook -ga after-rename-window    'run-shell -b ~/.dotfiles/bin/tmux-worktree-status-windows'
set-hook -ga after-select-window    'run-shell -b ~/.dotfiles/bin/tmux-worktree-status-windows'
set-hook -ga session-window-changed 'run-shell -b ~/.dotfiles/bin/tmux-worktree-status-windows'

# Background ticker catches a `git worktree add`/`remove` with no window event; render once now.
run-shell -b '~/.dotfiles/bin/tmux-worktree-status-watch'
run-shell -b '~/.dotfiles/bin/tmux-worktree-status-windows'


################################
# espanso trigger cheat sheet  #
################################

# prefix+e: a live-refreshing, filterable/scrollable popup listing every
# espanso.app text-replacement trigger and what it expands to (see
# bin/tmux-espanso-popup, -feed, -poll). Registered only when espanso is
# actually installed and has a config directory, so the binding itself
# doesn't exist -- rather than opening a broken popup -- on a machine where
# espanso isn't set up. -E: the popup's own command (fzf, or less as a
# fallback) is interactive and handles its own exit key, so once it returns
# the popup should close immediately, unlike the wait-for-any-keypress
# popups above.
if-shell -b 'command -v espanso >/dev/null 2>&1 && [ -d "$(espanso path config 2>/dev/null)" ]' \
  'bind e display-popup -w 80% -h 70% -b heavy -E "~/.dotfiles/bin/tmux-espanso-popup"'


################################
# Plugins (TPM)                #
################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# auto-save every 15 min, but never auto-restore: restoring a previous
# session on tmux start used to hijack `tmux new-session -s NAME` too,
# since the first session of a fresh server run is exactly when
# continuum's restore hook fires, so a plain `new-session` silently
# reincarnated whatever was last saved instead of creating the requested
# session. Restoring is still available, just always explicit now:
# prefix+Ctrl-r (tmux-resurrect's own default binding, unaffected by
# this setting).
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# auto-install TPM + all declared plugins on a fresh machine so dotfiles
# "just work" across machines. Sits after the @plugin declarations so the
# section reads in the order it conceptually happens (declare, then bootstrap)
# -- position is presentation only, not behavior: install_plugins discovers
# plugins by awk-ing this file for `set -g @plugin` (see TPM's
# scripts/helpers/plugin_functions.sh), not by reading tmux options, so it
# sees every declaration wherever this block sits.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'zsh -lc \"git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins\"'"


################################
# Local overrides              #
################################

source-file -q ~/.tmux.conf.local

# initialize TPM (must remain the last line)
run '~/.tmux/plugins/tpm/tpm'
